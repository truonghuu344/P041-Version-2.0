[project]
name = "p-041"
version = "0.1.0"
description = "Career Assistant X FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "google-auth>=2.35.0",
    "elevenlabs>=2.0.0,<3.0.0",

    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",

    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.0",

    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=4.0.0",
    "langgraph>=0.2.0",
    "google-genai>=1.0.0",

    "pgvector>=0.2.1",

    "beautifulsoup4>=4.12.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",

    "httpx>=0.28.0",
    "reportlab>=4.2.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "Jinja2>=3.1.6",
    "markdown>=3.10.2",
    "phonenumbers>=9.0.24",
    "pydantic-extra-types>=2.11.0",
    "ruamel.yaml>=0.19.1",
    "typst>=0.14.8",
    "rendercv-fonts>=0.5.1",
    "packaging>=26.0",
]
[project.scripts]
app = "src.main:app"

[tool.pyright]
extraPaths = ["src", "."]

[tool.pyrefly]
search-paths = ["src", "."]
