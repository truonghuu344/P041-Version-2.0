name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

  # Guardrail tests: chạy thủ công qua GitHub Actions UI
  workflow_dispatch:
    inputs:
      run_guardrails:
        description: "Chạy Guardrail / Adversarial tests (cần OPENAI_API_KEY thật)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  # ─── Job 1: Lint + Functional Tests (chạy mỗi push) ────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run functional tests (excluding guardrails)
        # test_guardrails cần LLM thật → chạy riêng
        run: pytest tests/ --ignore=tests/test_guardrails/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  # ─── Job 2: Guardrail / Adversarial Tests (manual trigger only) ──────────────
  guardrail-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_guardrails == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Guardrail tests (structural checks, no LLM)
        run: pytest tests/test_guardrails/ -v -m "not slow" --tb=long
        env:
          APP_ENV: test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run Guardrail tests (with real LLM)
        run: pytest tests/test_guardrails/ -v -m slow --tb=long
        env:
          APP_ENV: test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
